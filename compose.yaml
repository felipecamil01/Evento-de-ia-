# Optional local development database. Never use these credentials publicly.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eventia_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eventia_db:
